name: Deploy k3s

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  K8S_NAMESPACE: internes-eventmanagement
  INGRESS_HOST: ${{ vars.INGRESS_HOST }}
  INGRESS_TLS_SECRET: ${{ vars.INGRESS_TLS_SECRET || 'internes-eventmanagement-tls' }}

jobs:
  build_images:
    runs-on: ubuntu-latest
    outputs:
      ghcr_owner: ${{ steps.owner.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - id: owner
        name: Normalize GHCR owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_OUTPUT}"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/internes-eventmanagement-backend:latest
            ghcr.io/${{ steps.owner.outputs.value }}/internes-eventmanagement-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend migrator
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: migrator
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/internes-eventmanagement-backend-migrator:latest
            ghcr.io/${{ steps.owner.outputs.value }}/internes-eventmanagement-backend-migrator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/internes-eventmanagement-frontend:latest
            ghcr.io/${{ steps.owner.outputs.value }}/internes-eventmanagement-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build_images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Validate deploy configuration
        run: |
          test -n "${INGRESS_HOST}" || { echo "Missing repository variable INGRESS_HOST"; exit 1; }
          test -n "${{ secrets.KUBE_CONFIG_DATA }}" || { echo "Missing secret KUBE_CONFIG_DATA"; exit 1; }

      - name: Write kubeconfig
        run: |
          mkdir -p "${HOME}/.kube"
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Prepare manifests
        run: |
          cp -R deploy/k8s "${RUNNER_TEMP}/k8s"
          find "${RUNNER_TEMP}/k8s" -type f -name '*.yaml' -print0 | xargs -0 sed -i "s|ghcr.io/replace-me|ghcr.io/${{ needs.build_images.outputs.ghcr_owner }}|g"

      - name: Ensure namespace exists
        run: kubectl apply -f "${RUNNER_TEMP}/k8s/namespace.yaml"

      - name: Apply application secret
        run: |
          kubectl -n "${K8S_NAMESPACE}" create secret generic internes-eventmanagement-secrets \
            --from-literal=POSTGRES_USER='${{ secrets.POSTGRES_USER }}' \
            --from-literal=POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
            --from-literal=POSTGRES_DB='${{ secrets.POSTGRES_DB }}' \
            --from-literal=JWT_SECRET='${{ secrets.JWT_SECRET }}' \
            --from-literal=ANTHROPIC_API_KEY='${{ secrets.ANTHROPIC_API_KEY }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply base workloads
        run: kubectl apply -k "${RUNNER_TEMP}/k8s"

      - name: Wait for stateful services
        run: |
          kubectl -n "${K8S_NAMESPACE}" rollout status statefulset/postgres --timeout=5m
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/redis --timeout=5m

      - name: Run database sync job
        run: |
          kubectl -n "${K8S_NAMESPACE}" delete job backend-migrate --ignore-not-found
          kubectl apply -f "${RUNNER_TEMP}/k8s/backend-migrate.job.yaml"
          kubectl -n "${K8S_NAMESPACE}" wait --for=condition=complete job/backend-migrate --timeout=5m

      - name: Apply ingress
        run: |
          sed \
            -e "s|\${INGRESS_HOST}|${INGRESS_HOST}|g" \
            -e "s|\${INGRESS_TLS_SECRET}|${INGRESS_TLS_SECRET}|g" \
            "${RUNNER_TEMP}/k8s/ingress.template.yaml" | kubectl apply -f -

      - name: Wait for application rollout
        run: |
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/backend --timeout=5m
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/frontend --timeout=5m
