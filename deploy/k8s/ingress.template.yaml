apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: internes-eventmanagement
  namespace: internes-eventmanagement
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: ${INGRESS_HOST}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
  tls:
    - hosts:
        - ${INGRESS_HOST}
      secretName: ${INGRESS_TLS_SECRET}
