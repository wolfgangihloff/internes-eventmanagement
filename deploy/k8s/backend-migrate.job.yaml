apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: internes-eventmanagement
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: internes-eventmanagement-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: internes-eventmanagement-secrets
                  key: POSTGRES_DB
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
      containers:
        - name: migrator
          image: ghcr.io/replace-me/internes-eventmanagement-backend-migrator:latest
          imagePullPolicy: Always
          command:
            - npm
            - run
            - db:push
          envFrom:
            - configMapRef:
                name: internes-eventmanagement-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: internes-eventmanagement-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: internes-eventmanagement-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: internes-eventmanagement-secrets
                  key: POSTGRES_DB
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: internes-eventmanagement-secrets
                  key: JWT_SECRET
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: internes-eventmanagement-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
